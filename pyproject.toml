[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-monitor"
version = "1.0.0"
description = "跨平台服务状态监控工具（Qt 界面，Windows / Linux）"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6,<7",
    "psutil>=5.9",
]

[project.scripts]
service-monitor = "service_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
